name: Publish @hronaut/mcp

# Publishes packages/mcp to npm with provenance when its version is not on npm yet. Run it by hand after a version
# bump in packages/mcp/package.json has reached main; the plugin pins that version only afterwards.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Publish unless this version is already on npm
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@hronaut/mcp@$version" version >/dev/null 2>&1; then
            echo "@hronaut/mcp@$version is already on npm."
          else
            npm publish
          fi
