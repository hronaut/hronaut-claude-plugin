name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The headers helpers run under sh on Linux and macOS and through the .cmd on Windows.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  validate:
    name: Validate with Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate the plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.312 plugin validate --strict plugins/hronaut
      - name: Validate the marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.312 plugin validate --strict .
